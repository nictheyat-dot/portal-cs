[build]
  command = "node build-publicacao/build.mjs"
  publish = "build-publicacao/site"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/expulsoes"
  to = "/.netlify/functions/expulsoes"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' https://www.habbo.com.br; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/design-visual/fontes/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/midia-imagens/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
